<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>Hard-Hitting Headshots</title>

  <style>
    @font-face {
      font-family: "Henri Didot";
      src: url("./HenriDidot.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
  </style>

  <style>
    :root {
      --background: #f7f7f4;
      --text: #111111;
      --minimum-scale: 1;
      --maximum-scale: 1.58;
      --influence-radius: 240;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      font-family: "Henri Didot", Didot, "Bodoni MT", serif;
    }

    .headline-section {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(24px, 5vw, 72px);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.98) 0 20%, rgba(255,255,255,.50) 48%, rgba(255,255,255,0) 72%),
        linear-gradient(135deg, #ffffff 0%, #f7f7f4 48%, #ecece8 100%);
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      isolation: isolate;
    }

    .headline-section::before {
      content: "";
      position: absolute;
      inset: -25%;
      background:
        linear-gradient(115deg, transparent 0 40%, rgba(255,255,255,.75) 48%, transparent 58%);
      filter: blur(22px);
      pointer-events: none;
      opacity: .72;
    }

    .headline {
      position: relative;
      z-index: 2;
      width: min(1500px, 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: clamp(1px, .35vw, 7px);
      white-space: nowrap;
      line-height: .84;
      text-align: center;
    }

    .letter {
      --scale: 1;
      --spacing: 0em;

      display: inline-block;
      flex: 0 0 auto;
      color: var(--text);
      font-size: clamp(1.05rem, 5.75vw, 6.8rem);
      font-weight: 400;
      letter-spacing: var(--spacing);
      line-height: .84;
      transform: scale(var(--scale));
      transform-origin: center center;
      will-change: transform, letter-spacing;
    }

    .space {
      width: clamp(7px, 1.4vw, 28px);
      flex: 0 0 auto;
    }

    .hyphen {
      margin-inline: clamp(0px, .15vw, 3px);
    }

    @media (max-width: 820px) {
      .headline-section {
        min-height: 210px;
        padding: 20px 12px;
      }

      .headline {
        gap: 0;
      }

      .letter {
        font-size: clamp(.82rem, 5.15vw, 2.8rem);
      }

      .space {
        width: clamp(5px, 1.15vw, 11px);
      }
    }

    @media (max-width: 520px) {
      .headline-section {
        min-height: 180px;
        padding-inline: 8px;
      }

      .letter {
        font-size: clamp(.68rem, 4.75vw, 1.65rem);
      }

      .space {
        width: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter {
        transform: none !important;
        font-weight: 400 !important;
      }
    }
  </style>
</head>

<body>
  <main
    class="headline-section"
    id="headlineSection"
    aria-label="Hard-Hitting Headshots"
  >
    <div class="headline" id="headline"></div>
  </main>

  <script>
    (() => {
      const TEXT = "HARD-HITTING HEADSHOTS";
      const INFLUENCE_RADIUS = 240;
      const MIN_SCALE = 1;
      const MAX_SCALE = 1.58;
      const MAX_LETTER_SPACING = 0.065;
      const EASING_IN = 0.17;
      const EASING_OUT = 0.065;

      const section = document.getElementById("headlineSection");
      const headline = document.getElementById("headline");
      const letterElements = [];
      const states = [];

      let pointer = null;
      let animationFrame = null;

      [...TEXT].forEach((character, index) => {
        if (character === " ") {
          const space = document.createElement("span");
          space.className = "space";
          space.setAttribute("aria-hidden", "true");
          headline.appendChild(space);
          letterElements.push(null);
          states.push(null);
          return;
        }

        const span = document.createElement("span");
        span.className = character === "-" ? "letter hyphen" : "letter";
        span.textContent = character;
        span.setAttribute("aria-hidden", "true");

        headline.appendChild(span);
        letterElements.push(span);

        states.push({
          scale: MIN_SCALE,
          spacing: 0
        });
      });

      function smoothStep(value) {
        return value * value * (3 - 2 * value);
      }

      function animate() {
        const pointerX = pointer?.x ?? -99999;
        const pointerY = pointer?.y ?? -99999;
        const pointerIsAway = pointer === null;

        letterElements.forEach((letter, index) => {
          if (!letter) return;

          const rect = letter.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const distanceX = centerX - pointerX;
          const distanceY = centerY - pointerY;
          const distance = Math.sqrt(
            distanceX * distanceX + distanceY * distanceY
          );

          let influence = 0;

          if (distance < INFLUENCE_RADIUS) {
            influence = 1 - distance / INFLUENCE_RADIUS;
            influence = smoothStep(influence);
          }

          const targetScale =
            MIN_SCALE + (MAX_SCALE - MIN_SCALE) * influence;

          const targetSpacing =
            MAX_LETTER_SPACING * influence;

          const easing = pointerIsAway ? EASING_OUT : EASING_IN;
          const state = states[index];

          state.scale += (targetScale - state.scale) * easing;
          state.spacing += (targetSpacing - state.spacing) * easing;

          letter.style.setProperty(
            "--scale",
            state.scale.toFixed(3)
          );

          letter.style.setProperty(
            "--spacing",
            `${state.spacing.toFixed(3)}em`
          );
        });

        animationFrame = requestAnimationFrame(animate);
      }

      function setPointer(clientX, clientY) {
        pointer = {
          x: clientX,
          y: clientY
        };
      }

      section.addEventListener("pointermove", event => {
        setPointer(event.clientX, event.clientY);
      });

      section.addEventListener("pointerleave", () => {
        pointer = null;
      });

      section.addEventListener("touchstart", event => {
        const touch = event.touches[0];

        if (touch) {
          setPointer(touch.clientX, touch.clientY);
        }
      }, { passive: true });

      section.addEventListener("touchmove", event => {
        const touch = event.touches[0];

        if (touch) {
          setPointer(touch.clientX, touch.clientY);
        }
      }, { passive: true });

      section.addEventListener("touchend", () => {
        window.setTimeout(() => {
          pointer = null;
        }, 500);
      }, { passive: true });

      animate();

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(animationFrame);
      });
    })();
  </script>
</body>
</html>
